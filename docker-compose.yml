services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rkive
      POSTGRES_PASSWORD: rkive
      POSTGRES_DB: rkive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rkive -d rkive"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      # CRITICAL: Tells Ollama to listen for connections from other containers, not just localhost
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    # Note: You do NOT need a 'ports' block here unless you want your laptop 
    # to access Ollama directly. Leaving 'ports' out keeps it securely private 
    # to your Docker network.

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - upload_data:/data/uploads
    extra_hosts:
        - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/rkive.warool.com/fullchain.pem:/ssl/fullchain.pem
      - /etc/letsencrypt/live/rkive.warool.com/privkey.pem:/ssl/privkey.pem
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_data:
  upload_data:
  ollama_data:

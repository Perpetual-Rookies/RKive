[project]
name = "rkive-ingest"
version = "0.1.0"
description = "RKive markdown ingestion: chunk, embed via Ollama, upsert Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "qdrant-client>=1.12.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rkive_ingest"]
